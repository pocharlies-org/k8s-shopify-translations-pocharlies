# SKIRM-652: credenciales de la app de stage «Pocharlies Translations stage»
# (Dev Dashboard 205245572, app 451959685121), instalada en sii-test-sc1800.
# `namePrefix` en el kustomization pone el prefijo en el nombre del objeto; el
# `target.name` se escribe ya con el prefijo, como en k8s/externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef: { name: onepassword-connect, kind: ClusterSecretStore }
  target:
    name: translations-stage-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: { key: skirmshop-translations-stage }
