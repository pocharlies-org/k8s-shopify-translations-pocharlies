apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/pocharlies-org/k8s-shopify-framework-pocharlies.git//base?ref=deploy/prod
  - externalsecret.yaml

namePrefix: translations-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: translations

images:
  - name: shopify-app
    newName: harbor.e-dani.com/homelab/shopify-translation-app
    digest: sha256:4cfb53fa804f7bb4336ba01c38eca12341c2ef0786470f1cffc42a3a04c71939

patches:
  - target: { kind: Deployment, name: app }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        # The app has no node-local port or persistent volume claim, so a
        # replacement pod can start before the previous pod terminates.
        strategy:
          type: RollingUpdate
        template:
          spec:
            imagePullSecrets:
              - name: harbor-pull
            containers:
              - name: app
                env:
                  - { name: PORT, value: "3458" }
                  # Override the framework base's generic SCOPES (read_products,write_products):
                  # as a direct env var it shadows the real scopes coming from translations-secrets
                  # via envFrom. Must match k8s/expected-scopes.txt (guarded by scripts/verify-scopes.sh).
                  - { name: SCOPES, value: "read_content,read_locales,read_products,read_translations,write_content,write_locales,write_products,write_translations" }
                  - { name: DEV_MODE, value: "false" }
                  - { name: SHOPIFY_APP_URL, value: "https://skirmshop.e-dani.com/translations" }
                  - { name: BRAIN_URL, value: "http://skirmshop-brain.skirmshop-brain-prod.svc.cluster.local" }
                  - name: BRAIN_API_KEY
                    valueFrom: { secretKeyRef: { name: rag-secrets, key: BRAIN_API_KEY } }
                  # DB_USER/DB_PASSWORD must precede DATABASE_URL: kustomize orders
                  # patch env before base env, so $(DB_USER) wouldn't resolve otherwise.
                  - name: DB_USER
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: username } }
                  - name: DB_PASSWORD
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: password } }
                  # connection_limit: sin él Prisma dimensiona el pool con
                  # `cpus_fisicos * 2 + 1` LEIDO DEL HOST, no del límite del
                  # contenedor. El pod va a `role: edge` (sauvage, 48 vCPU, sin
                  # cpu limit) y el framework instancia un PrismaClient además
                  # del de la app → techo ~98 por pod. Ver el postmortem del
                  # 28-07-2026 en la base del framework.
                  # Este overlay sobrescribe DATABASE_URL, así que NO hereda el
                  # default acotado de base/deployment.yaml.
                  - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/translations?connection_limit=5&pool_timeout=15&connect_timeout=10&application_name=translations-app" }
                  - name: SYNAPSE_DB_USER
                    valueFrom: { secretKeyRef: { name: translations-secrets, key: SYNAPSE_DB_USER } }
                  - name: SYNAPSE_DB_PASSWORD
                    valueFrom: { secretKeyRef: { name: translations-secrets, key: SYNAPSE_DB_PASSWORD } }
                  - { name: SYNAPSE_DATABASE_URL, value: "postgresql://$(SYNAPSE_DB_USER):$(SYNAPSE_DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/synapse" }
                  - name: _RMQUSER
                    valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_USER } }
                  - name: _RMQPASS
                    valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_PASS } }
                  - { name: SYNAPSE_AMQP_URL, value: "amqp://$(_RMQUSER):$(_RMQPASS)@shared-rabbitmq.databases.svc.cluster.local:5672/%2Fsynapse" }
                envFrom:
                  - secretRef: { name: translations-secrets }
                resources:
                  limits: { memory: 768Mi }
                livenessProbe:
                  tcpSocket: { port: http }
                  initialDelaySeconds: 60
                  periodSeconds: 20
  - target: { group: apps, version: v1, kind: Deployment, name: app }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3458
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: app }
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`skirmshop.e-dani.com`) && PathPrefix(`/translations`)
