# SC-3028 (security): credenciales del usuario RabbitMQ propio de la app,
# synapse_plugin_shopify_translations (SKIRM-220). Consume la cola
# adapter.shopify-translations.translate_resource (+DLQ) y publica
# shopify-translations.skirmshop.resource.finished en events; ya no se usa el
# admin del broker (rabbitmq-secrets / RABBITMQ_DEFAULT_USER). Forma Connect:
# key = item, property = campo de 1Password (bóveda k8s-pocharlies). La
# rotación se propaga con force-sync del ArgoCD app (refreshPolicy OnChange).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef: { name: onepassword-connect, kind: ClusterSecretStore }
  target:
    name: translations-rabbitmq
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SYNAPSE_AMQP_USER
      remoteRef:
        key: synapse-plugin-shopify-translations
        property: rabbitmq_user
    - secretKey: SYNAPSE_AMQP_PASSWORD
      remoteRef:
        key: synapse-plugin-shopify-translations
        property: rabbitmq_password
